[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-metadata-explorer"
version = "0.2.0"
description = "Graphical desktop application for viewing, managing, and analyzing DICOM files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "dicom-anonymizer>=2.1,<3",
    "numpy>=2.0",
    "pydicom>=3.0,<4",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "PySide6>=6.6",
    "python-gdcm>=3.0.24",
]

[project.gui-scripts]
dicom-explorer = "dicom_explorer.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["dicom_explorer"]

[tool.ruff.format]
quote-style = "double"
