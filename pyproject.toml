[project]
name = "dicom-metadata-explorer"
version = "0.1.0"
description = "Graphical desktop application for viewing, managing, and analyzing DICOM files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.1",
    "pydicom==3.0.1",
    "pylibjpeg==2.0.1",
    "pylibjpeg-libjpeg==2.3.0",
    "PySide6==6.8.1",
    "python-gdcm==3.0.24.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["constants", "styles", "ui", "utils"]

[tool.ruff.format]
quote-style = "double"
